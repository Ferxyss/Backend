services:

  backend-ventas:
    image: ferxyss/innovatech-ventas:latest
    container_name: api_ventas
    restart: always
    ports:
      - "8001:8080"
    environment:
      - SPRING_DATASOURCE_URI=jdbc:mysql://10.0.137.164/innovatech_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=adminpassword

  backend-despachos:
    image: ferxyss/innovatech-despachos:latest
    container_name: api_despachos
    restart: always
    ports:
      - "8002:8080"
    environment:
      - SPRING_DATASOURCE_URI=jdbc:mysql://10.0.137.164/innovatech_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=adminpassword