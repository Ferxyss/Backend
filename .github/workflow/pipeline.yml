name: CI/CD Backend - Innovatech

on:
  push:
    branches:
      - deploy



jobs:
  build-and-push:
    runs-on: ubuntu-latest



    steps:
    - name: Descargar código
      uses: actions/checkout@v4


    - name: Iniciar sesión en Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}




    - name: Construir y Subir Backend Ventas
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/innovatech-ventas:latest -t ${{ secrets.DOCKER_USERNAME }}/innovatech-ventas:v${{ github.run_number }} ./back-Ventas_SpringBoot/Springboot-API-REST
        docker push ${{ secrets.DOCKER_USERNAME }}/innovatech-ventas --all-tags


    - name: Construir y Subir Backend Despachos
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/innovatech-despachos:latest -t ${{ secrets.DOCKER_USERNAME }}/innovatech-despachos:v${{ github.run_number }} ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
        docker push ${{ secrets.DOCKER_USERNAME}}/innovatech-despachos --all-tags