spring.application.name=Springboot-API-REST-VENTAS
# Quitamos el server.port=8081 para que internamente use el 8080 de Docker
spring.web.allow-cors=true

# Configuración de la base de datos MySQL en Docker Compose
spring.datasource.url=jdbc:mysql://db:3306/innovatech_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=admin
spring.datasource.password=adminpassword
spring.datasource.platform=mysql

# Configuración de Hibernate
spring.jpa.database=mysql
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

springdoc.swagger-ui.path=/swagger-ui.html